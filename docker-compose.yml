services:
  # ROUTE A: Developer Service
  dev-service:
    profiles: ["dev"]
    build:
      context: .
      target: developer
    image: stisim-hiv:3.14-dev
    volumes:
      # Mounts your simulation scripts and config files
      - .:/app/workspace
      # Maps your local cloned stisim source code into the container for use
      - ${STISIM_REPO_PATH:-../stisim}:/stisim
    stdin_open: true
    tty: true

  # ROUTE B: End-User / Production Service
  prod-service:
    profiles: ["prod"]
    build:
      context: .
      target: production
    image: stisim-hiv:3.14-prod
    volumes:
      # Mounts your simulation scripts and config files identically to dev
      - .:/app/workspace
