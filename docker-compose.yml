services:
  # ROUTE A: Developer Service
  dev-service:
    profiles: ["dev"]
    build:
      context: .
      target: developer
    image: stisim-hiv:3.14-dev
    volumes:
      # Mounts simulation scripts and config files
      - .:/app/workspace
      # Maps local cloned stisim source code into the container for use
      - ${STISIM_REPO_PATH:-../stisim}:/stisim
    stdin_open: true
    tty: true

  # ROUTE B: End-User / Production Service
  prod-service:
    profiles: ["prod"]
    build:
      context: .
      target: production
    image: stisim-hiv:3.14-prod
    volumes:
      # Mounts simulation scripts and config files
      - .:/app/workspace

  # ROUTE C: Automated Test Runner
  test-service:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: stisim-hiv:3.14-test
    volumes:
      # Mounts simulation scripts and config files
      - .:/app/workspace
    command: pytest tests/test_stisim_harness.py